name: Workflow permissions (check)

# Validates that every workflow in this repo declares an explicit top-level
# `permissions:` block (tuna-os/.github#155). This is the org's least-privilege
# baseline: a workflow with no block inherits the repository default, which is
# almost always broader than its jobs need.
#
# To adopt the baseline in a consumer repo, copy this file and
# scripts/check-workflow-permissions.py into that repo (project-starter ships
# both by default), or call this job from an existing CI workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permissions-check:
    name: Workflow permissions
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15"
      - name: Check workflow permissions
        run: python3 scripts/check-workflow-permissions.py .github/workflows
