name: CI Contract Verification (reusable)

# Verifies that every green criterion in .github/green-criteria.yml is asserted by
# reachable workflows, real jobs and steps, and satisfies freshness SLAs.
#
# Org-level reusable workflow adopting Hive practice #1 (epic #2250, issue #2260).

on:
  workflow_call:
    inputs:
      criteria-path:
        description: Path to green-criteria.yml
        required: false
        type: string
        default: .github/green-criteria.yml
      workflows-dir:
        description: Directory containing workflow YAML files
        required: false
        type: string
        default: .github/workflows
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  ci-contract:
    name: CI Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI contract
        uses: tuna-os/.github/.github/actions/ci-contract-check@main
        with:
          criteria-path: ${{ inputs.criteria-path }}
          workflows-dir: ${{ inputs.workflows-dir }}
          python-version: ${{ inputs.python-version }}
