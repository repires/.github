name: Fork Safety Checks (reusable)

# Static verification that pull_request workflows survive execution from forks.
#
# On a pull_request event raised from a fork, GitHub issues a read-only GITHUB_TOKEN
# and all repository secrets are empty. This workflow verifies that:
#   1. All pull_request workflows declare explicit permissions
#   2. pull_request_target is not used without an explicit exception
#   3. Steps performing write operations or referencing secrets are properly guarded
#
# Org-level reusable workflow adopting Hive practice #13 (epic #2250, issue #2260).

on:
  workflow_call:
    inputs:
      workflows-dir:
        description: Directory containing workflow YAML files
        required: false
        type: string
        default: .github/workflows
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  fork-safety:
    name: Fork Safety Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify fork safety of workflows
        uses: tuna-os/.github/.github/actions/fork-safety-check@main
        with:
          workflows-dir: ${{ inputs.workflows-dir }}
          python-version: ${{ inputs.python-version }}
